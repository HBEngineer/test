<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall iOS WebAR Sandbox</title>

  <!-- Load A-Frame & 8th Wall Open Source WebAR Engine -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- 8th Wall Open-Source WebAR Engine Library -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="https://apps.8thwall.com/8eth/xrweb"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-card {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div id="info-card">
    <b>iOS WebAR Sandbox</b><br>
    Point iPhone at the floor and tap to place the Cube.
  </div>

  <a-scene
    xrweb="allowedDevices: any"
    xrextras-generate-camera-feed
    xrextras-tap-recenter
    xrextras-loading
    xrextras-runtime-error>

    <a-camera position="0 1.6 0" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity light="type: directional; intensity: 1.5; castShadow: true" position="1 4 2"></a-entity>
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>

    <!-- Test 3D Cube -->
    <a-box 
      position="0 0.5 -2" 
      rotation="0 45 0" 
      color="#0088ff" 
      shadow
      animation="property: rotation; to: 0 405 0; loop: true; dur: 5000; easing: linear">
    </a-box>

    <!-- Floor Surface Receiver -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" shadow="receive: true" visible="false"></a-plane>
  </a-scene>

</body>
</html>
