<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall Test - Tap to Place</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camerafeed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
  </style>

  <!-- three.js (global/UMD build - 8th Wall's Threejs module expects a global THREE, not an ES module) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- 8th Wall Engine (open source, no login/API key required) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script src="./app.js" defer></script>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="status">Loading...</div>
</body>
</html>
