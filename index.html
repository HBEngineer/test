<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Festo Gantry Digital Twin - 8th Wall WebAR</title>

  <!-- MQTT Library -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- 8th Wall WebAR Engine -->
  <!-- Replace YOUR_APP_KEY with your key from the 8th Wall console -->
  <script async src="//apps.8thwall.com/8eth/xrweb?appKey=YOUR_APP_KEY"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000000;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    #status-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    #dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff9800;
      box-shadow: 0 0 8px #ff9800;
    }

    #ar-instruction {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="status-overlay">
    <div id="dot"></div>
    <span id="status">Connecting MQTT...</span>
  </div>

  <div id="ar-instruction">Tap screen to place Gantry</div>

  <div id="canvas-container"></div>

  <!-- Import Map for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
