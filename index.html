<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gantry Digital Twin</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="./favicon.ico" />
  
  <!-- External CSS -->
  <link rel="stylesheet" href="./style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="status-panel" class="panel">
    <div class="status-header">
      <div id="dot" class="dot"></div>
      <span id="status">Connecting...</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">X Axis:</span>
      <span id="val-x" class="telemetry-val">0 mm</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Y Axis:</span>
      <span id="val-y" class="telemetry-val">0 mm</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Z Axis:</span>
      <span id="val-z" class="telemetry-val">0 mm</span>
    </div>
  </div>

  <!-- Lighting Panel (Closed by default) -->
  <div id="light-panel" class="panel collapsed">
    <div id="light-panel-header" class="panel-header">
      <span>Lighting</span>
      <span class="arrow-icon"></span>
    </div>
    <div class="panel-body">
      <div class="control-group">
        <label for="ctrl-brightness">Master Brightness <span id="lbl-brightness">100%</span></label>
        <input type="range" id="ctrl-brightness" min="0.2" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label for="ctrl-angle">Light Angle <span id="lbl-angle">45°</span></label>
        <input type="range" id="ctrl-angle" min="0" max="360" step="5" value="45">
      </div>
    </div>
  </div>

  <div id="ar-scan-overlay">
    <span id="ar-scan-text">Scan surface...</span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
