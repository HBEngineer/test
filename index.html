<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Festo Gantry Digital Twin</title>

  <!-- MQTT Library -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- 8th Wall Engine for iOS WebAR -->
  <script async src="//apps.8thwall.com/8eth/xrweb"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #2b2b2b;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Connection Bar */
    #status-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    #dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff9800;
      box-shadow: 0 0 8px #ff9800;
    }

    /* Light Control Panel */
    #light-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 240px;
      background: rgba(30, 30, 30, 0.85);
      color: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: all 0.3s ease;
    }

    #light-panel.collapsed #light-panel-content {
      display: none;
    }

    #light-panel-header {
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ctrl-group {
      margin-top: 12px;
    }

    .ctrl-group label {
      display: block;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .ctrl-group input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="status-overlay">
    <div id="dot"></div>
    <span id="status">Connecting...</span>
  </div>

  <!-- Light Controls -->
  <div id="light-panel">
    <div id="light-panel-header">
      <span>Lighting Controls</span>
      <small style="color:#aaa;">?</small>
    </div>
    <div id="light-panel-content">
      <div class="ctrl-group">
        <label>Brightness: <span id="lbl-brightness">100%</span></label>
        <input type="range" id="ctrl-brightness" min="0.2" max="2.5" step="0.1" value="1">
      </div>
      <div class="ctrl-group">
        <label>Light Angle: <span id="lbl-angle">45°</span></label>
        <input type="range" id="ctrl-angle" min="0" max="360" step="5" value="45">
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
