<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gantry Digital Twin</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #2b2b2b;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* --- OVERLAY UI PANELS --- */
    .panel {
      position: absolute;
      z-index: 10;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* MQTT Status Panel (Top Left) */
    #status-panel {
      top: 20px;
      left: 20px;
      min-width: 220px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff5252;
      box-shadow: 0 0 10px #ff5252;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px;
      font-family: monospace;
    }

    .telemetry-label {
      color: #888;
    }

    .telemetry-val {
      color: #4caf50;
      font-weight: bold;
    }

    /* Simplified Light Panel (Top Right) */
    #light-panel {
      top: 20px;
      right: 20px;
      width: 260px;
      transition: all 0.3s ease;
    }

    .panel-header {
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header::after {
      content: '?';
      font-size: 10px;
      transition: transform 0.3s;
    }

    #light-panel.collapsed .panel-header::after {
      transform: rotate(180deg);
    }

    #light-panel.collapsed .panel-body {
      display: none;
    }

    .panel-body {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #2196f3;
      cursor: pointer;
    }

    /* AR Scanning Prompt Overlay */
    #ar-scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.75);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 15px;
      pointer-events: none;
      display: none;
      text-align: center;
    }

    #ar-scan-overlay.visible {
      display: block;
    }
  </style>

  <!-- Import Map for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- MQTT Client Library -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Telemetry Overlay -->
  <div id="status-panel" class="panel">
    <div class="status-header">
      <div id="dot" class="dot"></div>
      <span id="status">Connecting...</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">X Axis:</span>
      <span id="val-x" class="telemetry-val">0 mm</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Y Axis:</span>
      <span id="val-y" class="telemetry-val">0 mm</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Z Axis:</span>
      <span id="val-z" class="telemetry-val">0 mm</span>
    </div>
  </div>

  <!-- Simplified Lighting Controls -->
  <div id="light-panel" class="panel">
    <div id="light-panel-header" class="panel-header">Lighting</div>
    <div class="panel-body">
      <div class="control-group">
        <label for="ctrl-brightness">Master Brightness <span id="lbl-brightness">100%</span></label>
        <input type="range" id="ctrl-brightness" min="0.2" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label for="ctrl-angle">Light Angle <span id="lbl-angle">45°</span></label>
        <input type="range" id="ctrl-angle" min="0" max="360" step="5" value="45">
      </div>
    </div>
  </div>

  <!-- AR Instruction Overlay -->
  <div id="ar-scan-overlay">
    <span id="ar-scan-text">Scan surface...</span>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="./main.js"></script>
</body>
</html>
