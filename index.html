<!DOCTYPE html>
<!-- ============================================================================
     index.html   >>>  NO MODIFICATION NEEDED  <<<
     The title, telemetry rows (axes) and model are all driven by twin-config.js.
     Script ORDER at the bottom matters: config -> shared -> main -> ar-iphone.
     ============================================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Digital Twin</title><!-- replaced at runtime by appTitle in twin-config.js -->

  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- iPhone AR (8th Wall) - separate classic/global THREE instance -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./gltfloader-classic.js" onerror="window.__gltfScriptFailed = true" onload="window.__gltfScriptLoaded = true"></script>
  <script>window.__CAPTURED_THREE__ = window.THREE; window.__CAPTURED_GLTFLOADER__ = window.THREE && window.THREE.GLTFLoader;</script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <!-- Project config + shared logic (classic scripts, must run before main.js) -->
  <script src="./twin-config.js"></script>
  <script src="./twin-shared.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Status + telemetry. Rows are generated automatically from CONFIG.axes -->
  <div id="status-panel" class="panel">
    <div class="status-header">
      <div id="dot" class="dot"></div>
      <span id="status">Connecting...</span>
    </div>
    <div id="telemetry-rows"></div>
  </div>

  <div id="ar-scan-overlay">
    <span id="ar-scan-text">Scan surface...</span>
  </div>

  <!-- iOS Live AR (8th Wall) -->
  <button id="ios-live-ar-btn" class="ios-ar-button" style="display:none;">Start Live AR (Beta)</button>
  <canvas id="camerafeed" style="display: none;"></canvas>
  <div id="ios-ar-scan-overlay" class="ar-scan-overlay">
    <div class="ar-scan-card">
      <div id="ios-ar-scan-text">Starting AR...</div>
    </div>
  </div>
  <button id="ios-ar-exit-btn" class="ios-ar-exit-button" style="display: none;">Exit AR</button>
  <!-- Re-scan: recenters tracking and lets you place the model again -->
  <button id="ios-ar-rescan-btn" class="ios-ar-exit-button" style="display: none; top: auto; bottom: 20px; right: 20px;">Re-scan</button>

  <script>
    const __isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (__isIOS) document.getElementById('ios-live-ar-btn').style.display = 'flex';
  </script>

  <script type="module" src="./main.js"></script>
  <script src="./ar-iphone.js" defer></script>
</body>
</html>
